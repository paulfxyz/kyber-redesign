<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kyber — Real-time control for every machine</title>
<meta name="description" content="Kyber is real-time infrastructure for machine control. 8 ms end-to-end. Built by the VLC team.">
<meta name="theme-color" content="#050807">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script>
  // theme + lang before paint
  (function(){
    try{
      var t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
      var q = new URLSearchParams(location.search).get('lang');
      var l = q || 'en';
      document.documentElement.lang = l;
      document.documentElement.dir = (l==='ar'||l==='he') ? 'rtl' : 'ltr';
    }catch(e){}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip" href="#main" data-i="nav.skip">Skip to content</a>

<!-- preloader -->
<div class="loader" id="loader" aria-hidden="true">
  <div class="loader__inner">
    <svg class="loader__mark" viewBox="0 0 18.1 18.7" fill="currentColor"><path d="M12.79 18.605h5.233v-4.652l-5.232-4.65-5.233 4.65zM2.326 9.302l5.232-4.65V0H0v18.605h7.558V9.302zM18.023.0h-5.232L7.558 4.651v4.651h5.233l5.232-4.65z"/></svg>
    <div class="loader__num mono"><span id="loaderNum">200</span><small>ms</small></div>
    <div class="loader__bar"><i id="loaderBar"></i></div>
  </div>
</div>

<!-- route transition -->
<div class="wipe" id="wipe" aria-hidden="true"><span class="mono">8 ms</span></div>

<div class="cursor" aria-hidden="true"><i class="cursor__dot"></i><i class="cursor__ring"></i></div>
<div class="grain" aria-hidden="true"></div>
<div class="progress" aria-hidden="true"><i id="progress"></i></div>

<header class="hdr" id="hdr">
  <a href="#/" class="hdr__logo" aria-label="Kyber home">
    <svg viewBox="0 0 93 24" fill="currentColor" aria-hidden="true"><path d="M84.491 18.667V5.013h2.534l.293 2.054c.693-1.12 1.76-2.054 4.053-2.054h.667v2.694h-1.254c-2.586.0-3.386 2-3.386 4.106v6.854zm-8.116.16c-4.293.0-6.987-2.774-6.987-6.96.0-4.214 2.694-7.014 6.72-7.014 3.92.0 6.614 2.534 6.614 6.64v.987h-10.32v.16c0 2.293 1.546 3.84 3.813 3.84 1.786.0 3.093-.88 3.493-2.373h2.88c-.48 2.666-2.826 4.72-6.213 4.72m-3.894-8.48h7.307c-.24-2.027-1.626-3.174-3.653-3.174-1.814.0-3.413 1.174-3.654 3.174m-10.757 8.48c-2.16.0-3.627-.907-4.454-2.16l-.32 2h-2.533V0h2.907v7.013c.88-1.173 2.293-2.16 4.426-2.16 3.707.0 6.454 2.587 6.454 6.987.0 4.187-2.747 6.987-6.48 6.987m-.48-2.454c2.4.0 4-1.813 4-4.533.0-2.693-1.6-4.533-4-4.533-2.374.0-3.974 1.84-3.974 4.506.0 2.72 1.6 4.56 3.974 4.56M40.698 24v-2.533h2.027c1.12.0 1.386-.267 1.786-1.387l.507-1.36-5.253-13.707h3.093l3.76 10.374 3.733-10.374h3.067l-6.187 15.814C46.378 23.04 45.791 24 43.791 24z"/><path d="M27.442 18.667V0h2.907v11.627l6.16-6.614h3.386l-5.146 5.52 5.466 8.134H36.83l-4.08-5.974-2.4 2.507v3.467z"/><path d="M12.79 18.605h5.233v-4.652l-5.232-4.65-5.233 4.65zM2.326 9.302l5.232-4.65V0H0v18.605h7.558V9.302zM18.023.0h-5.232L7.558 4.651v4.651h5.233l5.232-4.65z"/></svg>
  </a>
  <nav class="hdr__nav" aria-label="Primary">
    <a href="#/technology" data-i="nav.technology">Technology</a>
    <div class="dd">
      <button class="dd__btn" aria-expanded="false" aria-haspopup="true"><span data-i="nav.solutions">Solutions</span><svg viewBox="0 0 10 6" width="10" height="6"><path d="M1 1l4 4 4-4" stroke="currentColor" fill="none" stroke-width="1.4"/></svg></button>
      <div class="dd__panel" id="ddPanel"></div>
    </div>
    <a href="#/sdk" data-i="nav.sdk">SDK</a>
    <a href="#/about" data-i="nav.about">Who we are</a>
    <a href="#/blog" data-i="nav.blog">Blog</a>
  </nav>
  <div class="hdr__tools">
    <span class="hdr__ping mono" title="Kyber end-to-end"><i></i><b id="ping">8.2</b> ms</span>
    <div class="lang">
      <button class="iconbtn lang__btn" aria-haspopup="listbox" aria-expanded="false" data-ia="nav.language" aria-label="Language">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>
        <span class="mono lang__code" id="langCode">EN</span>
      </button>
      <ul class="lang__list" role="listbox" id="langList"></ul>
    </div>
    <button class="iconbtn" id="themeBtn" data-ia="nav.theme" aria-label="Switch theme">
      <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
    <a href="#/contact" class="btn btn--solid btn--sm hdr__cta magnetic" data-i="nav.contact">Contact</a>
    <button class="iconbtn burger" id="burger" aria-expanded="false" data-ia="nav.menu" aria-label="Menu"><i></i><i></i></button>
  </div>
</header>

<div class="mnav" id="mnav" aria-hidden="true"></div>

<main id="main" tabindex="-1"></main>

<footer class="ftr" id="ftr"></footer>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.4/dist/lenis.min.js"></script>
<script src="js/fx.js"></script>
<script src="js/app.js"></script>
</body>
</html>
